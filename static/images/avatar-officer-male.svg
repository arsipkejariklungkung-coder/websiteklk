<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="goldCollar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="20" fill="url(#bgGradM)"/>
  
  <!-- Uniform shoulders / coat (Kejaksaan Dark Green) -->
  <path d="M 20,160 L 20,130 Q 80,105 140,130 L 140,160 Z" fill="#0B3B24" stroke="#072A19" stroke-width="2"/>
  
  <!-- White shirt collar -->
  <polygon points="65,115 80,135 95,115 80,122" fill="#FFFFFF"/>
  <!-- Dark green necktie -->
  <polygon points="76,122 84,122 86,155 80,160 74,155" fill="#072A19"/>

  <!-- Gold rank insignia on lapel -->
  <circle cx="48" cy="132" r="3" fill="url(#goldCollar)"/>
  <circle cx="112" cy="132" r="3" fill="url(#goldCollar)"/>

  <!-- Neck -->
  <rect x="70" y="85" width="20" height="32" rx="4" fill="#F8C8A5"/>

  <!-- Head -->
  <ellipse cx="80" cy="70" rx="26" ry="32" fill="#F8C8A5"/>

  <!-- Hair (Male short parted) -->
  <path d="M 52,65 Q 52,40 80,38 Q 108,40 108,65 Q 106,45 80,44 Q 54,46 52,65 Z" fill="#1E293B"/>
  
  <!-- Eyebrows & Eyes -->
  <rect x="63" y="62" width="10" height="2" rx="1" fill="#334155"/>
  <rect x="87" y="62" width="10" height="2" rx="1" fill="#334155"/>
  <circle cx="68" cy="68" r="2.5" fill="#0F172A"/>
  <circle cx="92" cy="68" r="2.5" fill="#0F172A"/>

  <!-- Nose & Smile -->
  <path d="M 80,68 L 78,76 L 82,76" fill="none" stroke="#D97706" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 72,84 Q 80,90 88,84" fill="none" stroke="#9A3412" stroke-width="2" stroke-linecap="round"/>
</svg>