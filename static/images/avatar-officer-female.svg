<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="goldCollarF" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="20" fill="url(#bgGradF)"/>
  
  <!-- Hair back -->
  <ellipse cx="80" cy="78" rx="34" ry="40" fill="#1E293B"/>

  <!-- Uniform shoulders / coat (Kejaksaan Dark Green) -->
  <path d="M 22,160 L 22,132 Q 80,108 138,132 L 138,160 Z" fill="#0B3B24" stroke="#072A19" stroke-width="2"/>
  
  <!-- White scarf / collar -->
  <polygon points="68,118 80,138 92,118 80,125" fill="#FFFFFF"/>
  <polygon points="76,125 84,125 86,155 80,160 74,155" fill="#072A19"/>

  <!-- Gold rank insignia on lapel -->
  <circle cx="50" cy="134" r="3" fill="url(#goldCollarF)"/>
  <circle cx="110" cy="134" r="3" fill="url(#goldCollarF)"/>

  <!-- Neck -->
  <rect x="71" y="88" width="18" height="30" rx="4" fill="#FAD1B5"/>

  <!-- Head -->
  <ellipse cx="80" cy="72" rx="25" ry="30" fill="#FAD1B5"/>

  <!-- Hair front style -->
  <path d="M 54,65 Q 54,42 80,40 Q 106,42 106,65 Q 98,46 80,45 Q 62,47 54,65 Z" fill="#0F172A"/>
  <path d="M 52,65 Q 52,90 60,105 Q 65,88 64,72 Z" fill="#0F172A"/>
  <path d="M 108,65 Q 108,90 100,105 Q 95,88 96,72 Z" fill="#0F172A"/>
  
  <!-- Eyebrows & Eyes -->
  <rect x="64" y="64" width="9" height="2" rx="1" fill="#334155"/>
  <rect x="87" y="64" width="9" height="2" rx="1" fill="#334155"/>
  <circle cx="68" cy="70" r="2.5" fill="#0F172A"/>
  <circle cx="92" cy="70" r="2.5" fill="#0F172A"/>

  <!-- Nose & Smile -->
  <path d="M 80,70 L 78,77 L 82,77" fill="none" stroke="#D97706" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 73,85 Q 80,91 87,85" fill="none" stroke="#DC2626" stroke-width="2" stroke-linecap="round"/>
</svg>