<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B3B24"/>
      <stop offset="100%" stop-color="#051D12"/>
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#072A19" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Starburst / Sun rays -->
  <circle cx="100" cy="100" r="92" fill="#FEF08A" stroke="#EAB308" stroke-width="4"/>
  <circle cx="100" cy="100" r="84" fill="url(#shieldBg)" stroke="url(#goldRibbon)" stroke-width="3" filter="url(#badgeShadow)"/>

  <!-- Gold Star on Top -->
  <polygon points="100,26 103,34 112,34 105,39 108,47 100,42 92,47 95,39 88,34 97,34" fill="#FDE047"/>

  <!-- Badge Text WBK / WBBM -->
  <text x="100" y="70" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="800" fill="#FEF08A" text-anchor="middle" letter-spacing="1.5">
    ZONA INTEGRITAS
  </text>
  
  <rect x="35" y="82" width="130" height="34" rx="8" fill="url(#goldRibbon)" filter="url(#badgeShadow)"/>
  <text x="100" y="105" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="900" fill="#072A19" text-anchor="middle" letter-spacing="1">
    WBK / WBBM
  </text>

  <text x="100" y="132" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9.5" font-weight="700" fill="#E2E8F0" text-anchor="middle" letter-spacing="0.5">
    WILAYAH BEBAS KORUPSI
  </text>

  <text x="100" y="146" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8" font-weight="600" fill="#CBD5E1" text-anchor="middle">
    KEMENPAN-RB &amp; KEJAKSAAN RI
  </text>

  <!-- Laurel wreath deco at bottom -->
  <path d="M 60,165 Q 100,180 140,165" fill="none" stroke="#EAB308" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="100" cy="172" r="3" fill="#FDE047"/>
</svg>